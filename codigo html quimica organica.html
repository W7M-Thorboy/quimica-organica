    const progressState = {};
    const loadedFrames = {};
    let activeTopic = 't1';

    try {
      const saved = localStorage.getItem('qo_2456sea_active_topic');
      if (saved && TOPIC_B64[saved]) activeTopic = saved;
    } catch (e) {}

    function decodeBase64Utf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function ensureFrame(topicId) {
      if (loadedFrames[topicId]) return loadedFrames[topicId];
      const iframe = document.createElement('iframe');
      iframe.id = 'frame-' + topicId;
      iframe.className = 'topic-frame hidden';
      iframe.title = TOPICS.find(t => t.id === topicId)?.label || topicId;
      iframe.srcdoc = decodeBase64Utf8(TOPIC_B64[topicId]);
      document.getElementById('frameContainer').appendChild(iframe);
      loadedFrames[topicId] = iframe;
      return iframe;
    }

    function renderTabs() {
      const container = document.getElementById('topicTabs');
      container.innerHTML = TOPICS.map(t => {
        const isActive = t.id === activeTopic;
        const st = progressState[t.id];
        const badge = st ? `${st.done}/${st.total}` : '…';
        const btnCls = isActive
          ? `${t.bgActive}`
          : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:bg-slate-800 hover:text-white';
        const badgeCls = isActive
          ? 'bg-black/20 text-white'
          : 'bg-slate-900/70 text-slate-400';
        return `
          <button
            onclick="selectTopic('${t.id}')"
            class="shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-semibold transition cursor-pointer ${btnCls}"
          >
            <span class="w-2 h-2 rounded-full ${isActive ? 'bg-white' : t.dot}"></span>
            <span>${t.short}</span>
            <span class="hidden lg:inline font-normal opacity-90">· ${t.label}</span>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeCls}">${badge}</span>
          </button>
        `;
      }).join('');
    }

    function updateGlobalProgress() {
      let done = 0;
      let total = 0;
      Object.values(progressState).forEach(s => {
        done += s.done;
        total += s.total;
      });
      const textEl = document.getElementById('globalProgressText');
      const barEl = document.getElementById('globalProgressBar');
      textEl.textContent = `${done} / ${total} dominados`;
      barEl.style.width = total > 0 ? `${Math.round((done / total) * 100)}%` : '0%';
      renderTabs();
    }

    function selectTopic(topicId) {
      activeTopic = topicId;
      try { localStorage.setItem('qo_2456sea_active_topic', topicId); } catch (e) {}
      ensureFrame(topicId);
      Object.entries(loadedFrames).forEach(([id, frame]) => {
        if (id === topicId) {
          frame.classList.remove('hidden');
        } else {
          frame.classList.add('hidden');
        }
      });
      renderTabs();
    }

    window.addEventListener('message', function(ev) {
      const d = ev.data;
      if (d && d.type === 'qo_topic_progress' && d.topicId) {
        progressState[d.topicId] = { done: d.done, total: d.total };
        updateGlobalProgress();
      }
    });

    // Initial render + eager background load of remaining topics
    selectTopic(activeTopic);
    setTimeout(() => {
      TOPICS.forEach(t => {
        if (!loadedFrames[t.id]) ensureFrame(t.id);
      });
    }, 250);
  </script>
